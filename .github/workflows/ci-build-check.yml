name: Jekyll build check (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify rendered content
        run: |
          set -e
          test -f _site/index.html
          grep -q "Junteng Liu" _site/index.html
          grep -q "SynLogic" _site/index.html
          grep -q "Perception Bottleneck" _site/index.html
          grep -q "Universal Truthfulness Hyperplane" _site/index.html
          grep -q "In-Context Sharpness" _site/index.html
          grep -q "C-Eval" _site/index.html
          grep -q "Composing Parameter-Efficient Modules" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "Vicent0205" _site/index.html
          test -f _site/publications/index.html
          grep -q "SynLogic" _site/publications/index.html
          grep -q "Universal Truthfulness Hyperplane" _site/publications/index.html
          grep -q "C-Eval" _site/publications/index.html
          ls _site/publication
